<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="end.css">
    <title>Slutstrid - Bo01</title>
</head>

<body>

    <div id="introContainer">
        <p class="story-text">
            Danskarna och Bo01-ligan har samlats på platsen. De står tätt ihop och diskuterar sitt nästa drag.
            Aktivera din dolda mikrofon och avlyssna deras möte innan du agerar!
        </p>
        <p class="volume-reminder">⚠️ OBS! Se till att ha ljudet påslaget på din mobil.</p>
        <button id="listenBtn" class="actionBtn">LYSSNA PÅ MÖTET</button>
    </div>

    <div id="gameplayArea" class="displayNone">
        <div id="text">
            <h1>Vem skjuter du?</h1>
        </div>

        <div id="imgContainer">
            <div id="selectionOne" class="team-box">
                <h2>Danskarna</h2>
                <img src="../bilder/danishBoys.png" alt="Danskarna">
            </div>

            <div id="selectionTwo" class="team-box">
                <h2>Svenskarna</h2>
                <img src="../bilder/swedishBoys.png" alt="Svenskarna">
                <img id="shootIcon" src="../bilder/shoot.png" alt="Sikte">
            </div>
        </div>

        <div id="buttonContainer">
            <button class="shootBtn" id="danish">Danskarna</button>
            <button class="shootBtn" id="swedish">Svenskarna</button>
        </div>
    </div>

    <script src="end.js"></script>
</body>

</html>
